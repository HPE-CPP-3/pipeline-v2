apiVersion: apps/v1
kind: Deployment
metadata:
  name: stress-test-app
  namespace: test-workload
  labels:
    app: stress-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stress-test
  template:
    metadata:
      labels:
        app: stress-test
    spec:
      containers:
      - name: stress-container
        image: polinux/stress:latest
        command: ["sh", "-c"]
        args:
          - |
            while true; do
              echo "Low load"
              stress --cpu 1 --timeout 120s || true

              echo "High load"
              stress --cpu 4 --timeout 60s || true

              echo "Back to low load"
              stress --cpu 1 --timeout 60s || true

              echo "Idle"
              sleep 600
            done
        resources:
          requests:
            cpu: "0.5"
            memory: "256Mi"
          limits:
            cpu: "2.0"
            memory: "512Mi"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: stress-test-service
  namespace: test-workload
spec:
  selector:
    app: stress-test
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
